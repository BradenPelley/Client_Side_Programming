<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Metric to Imperial Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Metric to Imperial Converter</h1>

    <input type="number" id="valueInput" placeholder="Enter a value">

    <select id="conversionType">
      <option value="kmToMiles">Kilometers → Miles</option>
      <option value="cToF">Celsius → Fahrenheit</option>
      <option value="metersToFeet">Meters → Feet</option>
      <option value="kgToPounds">Kilograms → Pounds</option>
    </select>

    <button onclick="convert()">Convert</button>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
